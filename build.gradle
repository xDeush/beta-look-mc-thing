plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	// Kod klienta w src/client -- serwer nie ma klas renderu i bez tego
	// mod by sie wywalil przy starcie dedyka.
	splitEnvironmentSourceSets()

	mods {
		"betalook" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// Brak wpisu 'mappings' -- od 26.1 loom nie remapuje i uzywa nazw Mojanga.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def modVersion = project.version
	inputs.property 'version', modVersion
	inputs.property 'minecraft_version', project.minecraft_version
	inputs.property 'loader_version', project.loader_version

	filesMatching('fabric.mod.json') {
		expand 'version': modVersion,
				'minecraft_version': project.minecraft_version,
				'loader_version': project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
