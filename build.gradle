plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	// Kod klienta w src/client -- serwer nie ma klas renderu i bez tego
	// mod by sie wywalil przy starcie dedyka.
	splitEnvironmentSourceSets()

	mods {
		"betalook" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// Brak wpisu 'mappings' -- od 26.1 loom nie remapuje i uzywa nazw Mojanga.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def modVersion = project.version
	inputs.property 'version', modVersion
	inputs.property 'minecraft_version', project.minecraft_version
	inputs.property 'loader_version', project.loader_version

	filesMatching('fabric.mod.json') {
		expand 'version': modVersion,
				'minecraft_version': project.minecraft_version,
				'loader_version': project.loader_version
	}
}

java {
	withSourcesJar()

	// Toolchain, a nie sourceCompatibility: dzieki temu Gradle SZUKA
	// zainstalowanego JDK 25, zamiast probowac kompilowac tym, na ktorym
	// sam zostal uruchomiony. Jesli JAVA_HOME wskazuje starsza Jave, a JDK 25
	// jest gdziekolwiek w systemie, build i tak przejdzie -- i dostajesz
	// konkretny komunikat "no matching toolchain" zamiast mglistego
	// "release version 25 not supported".
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
